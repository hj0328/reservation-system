# H2 인메모리 데이터베이스 설정 (MySQL 모드로 동작시키려면 MODE=MySQL 옵션 추가)
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
# spring.datasource.username=sa
# spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/reservation_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=test_user
spring.datasource.password=Abcd1234!@

# colorful 로그 찍기
spring.output.ansi.enabled=always

# H2 콘솔 활성화
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# JPA 설정
spring.jpa.database-platform=org.hibernate.dialect.MariaDB106Dialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.type.descriptor.sql.trace=true

# resources/data
 spring.sql.init.mode=always

# Redis 설정
spring.redis.host=localhost
spring.redis.port=6379

