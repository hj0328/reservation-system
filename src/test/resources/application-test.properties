# H2 인메모리 데이터베이스 설정 (MySQL 모드로 동작시키려면 MODE=MySQL 옵션 추가)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE

spring.datasource.username=sa
spring.datasource.password=

# colorful 로그찍기
spring.output.ansi.enabled=always

# H2 콘솔 활성화 (필요시)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA 설정
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.descriptor.sql.trace=true

# resources/data 의 sql 파일을 실행하기 위한 설정
# spring.sql.init.mode=always

# Redis 설정
spring.data.redis.host=localhost
spring.data.redis.port=6379

# insert sql 문 로그 출력
#logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG
#logging.level.org.springframework.jdbc.datasource.init.DataSourceInitializer=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# p6spy로 sql 로그 출력
decorator.datasource.p6spy.enable-logging=true